# Pre-commit hooks de la suite financial_tools (Art. 7 y 17 Constitución)
# Instalación: pip install pre-commit && pre-commit install

repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.17.2
    hooks:
      - id: ruff
        args: [--fix]
        files: ^packages/(finances-core|finances-downloader|finances-api)/
      - id: ruff-format
        files: ^packages/(finances-core|finances-downloader|finances-api)/

  # mypy local (sistema): cada paquete importa a los demás, por eso usa el .venv del repo
  # en lugar del entorno aislado de mirrors-mypy.
  - repo: local
    hooks:
      - id: mypy-finances-core
        name: mypy --strict (finances-core)
        language: system
        entry: python -m mypy --strict --config-file packages/finances-core/pyproject.toml packages/finances-core/src
        files: ^packages/finances-core/src/
        pass_filenames: false
      - id: mypy-finances-downloader
        name: mypy --strict (finances-downloader)
        language: system
        entry: python -m mypy --strict --config-file packages/finances-downloader/pyproject.toml packages/finances-downloader/src
        files: ^packages/finances-downloader/src/
        pass_filenames: false
      - id: mypy-finances-api
        name: mypy --strict (finances-api)
        language: system
        entry: python -m mypy --strict --config-file packages/finances-api/pyproject.toml packages/finances-api/src
        files: ^packages/finances-api/src/
        pass_filenames: false
