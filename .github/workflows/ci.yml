# CI de financial_tools (Art. 7, 17 y 20 de la Constitución).
# Cada paquete se verifica desde su propio directorio porque tiene su pyproject.toml.
name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Ubuntu fijo (no -latest): los umbrales del benchmark se calibraron en esta imagen;
        # cambiar de imagen debe ser una decisión explícita que recalibre (ft_indicators RF-14).
        os: [windows-latest, ubuntu-24.04]
        python: ["3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install packages (editable, core first)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "packages/finances-core[dev]"
          python -m pip install -e "packages/finances-downloader[dev]"
          # ta-lib es dependencia de runtime de finances-analytics (ft_ta_lib) y la usan los tests
          # de paridad de ft_indicators (rueda binaria, plan §3.11)
          python -m pip install -e "packages/finances-analytics[dev]"
          python -m pip install -e "packages/finances-api[service,dev]"

      - name: TA-Lib binary wheel available
        run: python -c "import talib; print('talib', talib.__version__)"

      - name: Ruff (lint + format)
        run: |
          python -m ruff check packages
          python -m ruff format --check packages

      - name: Mypy --strict and pytest per package
        run: |
          for pkg in finances-core finances-downloader finances-analytics finances-api; do
            echo "::group::$pkg"
            (cd "packages/$pkg" && python -m mypy --strict src && python -m pytest -q)
            echo "::endgroup::"
          done

      # RF-14 / T6.2 de ft_indicators: benchmarks B1/B2 solo en ubuntu-24.04 (umbrales en
      # tests/ft_indicators/benchmarks/thresholds.json, calibrados en T6.3): el job falla ante
      # una regresión.
      - name: Benchmarks ft_indicators (ubuntu-24.04)
        if: matrix.os == 'ubuntu-24.04'
        working-directory: packages/finances-analytics
        env:
          BENCH_OUTPUT: ${{ github.workspace }}/bench-results/ft_indicators.json
          BENCH_ENFORCE: "1"
        run: python -m pytest -m benchmark -s -q tests/ft_indicators/benchmarks

      # RF-15 / T5.2 de ft_ta_lib: benchmarks B1/B2/B3 solo en ubuntu-24.04. Umbrales
      # provisionales en tests/ft_ta_lib/benchmarks/thresholds.json: BENCH_ENFORCE "0" hasta
      # calibrar con la primera ejecución real (1,5 x mediana); entonces pasa a "1".
      - name: Benchmarks ft_ta_lib (ubuntu-24.04, calibración)
        if: matrix.os == 'ubuntu-24.04'
        working-directory: packages/finances-analytics
        env:
          BENCH_OUTPUT: ${{ github.workspace }}/bench-results/ft_ta_lib.json
          BENCH_ENFORCE: "0"
        run: python -m pytest -m benchmark -s -q tests/ft_ta_lib/benchmarks

      - name: Upload benchmark results
        if: matrix.os == 'ubuntu-24.04' && success()
        uses: actions/upload-artifact@v7
        with:
          name: bench-ft_indicators-${{ github.sha }}
          path: bench-results/ft_indicators.json
          if-no-files-found: error

      - name: Upload benchmark results ft_ta_lib
        if: matrix.os == 'ubuntu-24.04' && success()
        uses: actions/upload-artifact@v7
        with:
          name: bench-ft_ta_lib-${{ github.sha }}
          path: bench-results/ft_ta_lib.json
          if-no-files-found: error
