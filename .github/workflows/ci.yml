# CI de financial_tools (Art. 7, 17 y 20 de la Constitución).
# Cada paquete se verifica desde su propio directorio porque tiene su pyproject.toml.
name: CI

on:
  push:
  pull_request:

jobs:
  checks:
    name: ${{ matrix.os }} / py${{ matrix.python }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
        python: ["3.12"]
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
          cache: pip

      - name: Install packages (editable, core first)
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e "packages/finances-core[dev]"
          python -m pip install -e "packages/finances-downloader[dev]"
          # [dev] incluye ta-lib (rueda binaria; contraste de ft_indicators, plan §3.11)
          python -m pip install -e "packages/finances-analytics[dev]"
          python -m pip install -e "packages/finances-api[service,dev]"

      - name: TA-Lib binary wheel available
        run: python -c "import talib; print('talib', talib.__version__)"

      - name: Ruff (lint + format)
        run: |
          python -m ruff check packages
          python -m ruff format --check packages

      - name: Mypy --strict and pytest per package
        run: |
          for pkg in finances-core finances-downloader finances-analytics finances-api; do
            echo "::group::$pkg"
            (cd "packages/$pkg" && python -m mypy --strict src && python -m pytest -q)
            echo "::endgroup::"
          done

      # RF-14 / T6.2 de ft_indicators: benchmarks B1/B2 solo en ubuntu-latest (umbrales en
      # tests/ft_indicators/benchmarks/thresholds.json). BENCH_ENFORCE=0 hasta la calibración
      # de T6.3; después pasa a 1 y el job falla ante una regresión.
      - name: Benchmarks ft_indicators (ubuntu-latest)
        if: matrix.os == 'ubuntu-latest'
        working-directory: packages/finances-analytics
        env:
          BENCH_OUTPUT: ${{ github.workspace }}/bench-results/ft_indicators.json
          BENCH_ENFORCE: "0"
        run: python -m pytest -m benchmark -s -q

      - name: Upload benchmark results
        if: matrix.os == 'ubuntu-latest' && !cancelled()
        uses: actions/upload-artifact@v7
        with:
          name: bench-ft_indicators-${{ github.sha }}
          path: bench-results/ft_indicators.json
          if-no-files-found: error
