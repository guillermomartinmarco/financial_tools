[project]
name = "finances-downloader"
version = "0.1.0"
description = "Market data downloaders for financial_tools suite"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "finances-core @ file:///c/P/financial_tools/packages/finances-core",
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    "typer[all]>=0.12",
    "fastapi>=0.111",
    "httpx>=0.27",
    "polars>=1.6",
    "structlog>=24.1",
    "rich>=13.7",
    "uuid6>=1.11",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "pyarrow>=16.0",
    "zstandard>=0.22",
]

[project.scripts]
ft_market_data_binance = "finances_downloader.ft_market_data_binance.cli:app"
ft_data_viewer = "finances_downloader.ft_data_viewer.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["finances_downloader*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T20", "PTH", "PD", "PGH", "PL", "TRY", "NPY"]
ignore = []
fixable = ["I", "F", "E", "W", "UP", "B", "C4", "SIM", "T20", "PTH", "PD", "PGH", "PL", "TRY", "NPY"]
unfixable = []
exclude = ["**/tests/**", "**/.venv/**", "**/__pycache__/**"]

[tool.ruff.lint.per-file-ignores]
"src/finances_downloader/ft_market_data_binance/cli.py" = ["PLR0913", "PLR0917", "B008", "TRY301", "B904", "E501", "PLC0415"]
"src/finances_downloader/ft_market_data_binance/api.py" = ["PLR0913", "PLR0917", "B008", "TRY400", "B904", "C401", "SIM118", "E501", "PLC0415"]
"src/finances_downloader/ft_market_data_binance/client.py" = ["PLR0913", "PLR0917", "PLR2004", "TRY300", "TRY301", "TRY003", "SIM115", "PTH123", "E501", "E402"]
"src/finances_downloader/ft_market_data_binance/service.py" = ["PLR0913", "PLR0917", "PLR0915", "C401", "TRY400", "B007", "E501"]
"src/finances_downloader/ft_market_data_binance/writer.py" = ["E501", "PLW2901"]
"src/finances_downloader/ft_market_data_binance/planner.py" = ["PLR0913", "PLR0917", "PLR2004", "TRY003", "E501"]
"src/finances_downloader/ft_market_data_binance/inventory.py" = ["E501"]
"src/finances_downloader/ft_market_data_binance/normalizer.py" = ["PLR0913", "PLR0917", "C416", "B905", "TRY003", "E501"]
"src/finances_downloader/ft_market_data_binance/public_data.py" = ["PLR2004", "E501"]
"src/finances_downloader/ft_market_data_binance/rest_api.py" = ["PLR0913", "PLR0917", "F841"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
strict = true
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = "finances_downloader.*"
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"

[tool.uv]
dev-dependencies = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
]