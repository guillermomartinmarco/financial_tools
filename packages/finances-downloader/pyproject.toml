[project]
name = "finances-downloader"
version = "0.1.0"
description = "Market data downloaders for financial_tools suite"
requires-python = ">=3.11"
dependencies = [
    "finances-core",
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "fastapi>=0.111",
    "httpx>=0.27",
    "polars>=1.6",
    "structlog>=24.1",
    "rich>=13.7",
    "uuid6>=1.11",
    "python-dotenv>=1.0",
    "tenacity>=8.2",
    "pyarrow>=16.0",
    "zstandard>=0.22",
    "yfinance>=1.7",
]

[project.scripts]
ft_market_data_binance = "finances_downloader.ft_market_data_binance.cli:app"
ft_data_viewer = "finances_downloader.ft_data_viewer.cli:app"
ft_market_data_yfinance = "finances_downloader.ft_market_data_yfinance.cli:app"
ft_datasets = "finances_downloader.ft_datasets.cli:app"

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["finances_downloader*"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T20", "PTH", "PD", "PGH", "PL", "TRY", "NPY"]
ignore = []
fixable = ["I", "F", "E", "W", "UP", "B", "C4", "SIM", "T20", "PTH", "PD", "PGH", "PL", "TRY", "NPY"]
unfixable = []
exclude = ["**/.venv/**", "**/__pycache__/**"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "TRY003", "PLR0913", "PLR0917"]
# Firmas planas exigidas por plan.md (opciones Typer / query params FastAPI / contratos de servicio)
"src/finances_downloader/*/cli.py" = ["PLR0913", "PLR0917"]
"src/finances_downloader/*/api.py" = ["PLR0913", "PLR0917"]
"src/finances_downloader/ft_market_data_binance/client.py" = ["PLR0913", "PLR0917"]
"src/finances_downloader/ft_market_data_binance/normalizer.py" = ["PLR0913", "PLR0917"]
"src/finances_downloader/ft_market_data_binance/rest_api.py" = ["PLR0913", "PLR0917"]
"src/finances_downloader/ft_market_data_yfinance/adapter.py" = ["PLR0913"]
"src/finances_downloader/ft_market_data_yfinance/normalizer.py" = ["PLR0913"]
"src/finances_downloader/ft_market_data_yfinance/service.py" = ["PLR0913", "PLR0917"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument", "fastapi.Query", "fastapi.Path", "fastapi.Depends"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
strict = true
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[[tool.mypy.overrides]]
module = ["pyarrow", "pyarrow.*"]
ignore_missing_imports = true

# yfinance no publica stubs (pandas se tipa con pandas-stubs, extra dev)
[[tool.mypy.overrides]]
module = ["yfinance", "yfinance.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
markers = ["real_data: tests con datos reales materializados por ft_datasets; excluidos por defecto"]
addopts = "-v --tb=short -m 'not real_data'"

[tool.uv]
dev-dependencies = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "pandas-stubs>=2.2",
]