# packages/finances-core/src/ft_setup/env_list.conf
# Registro canónico de variables FT_* (Art. 16 Constitución)
# source_tool: tool que introduce la variable
# since_version: versión de la tool que la requirió

[[vars]]
name = "FT_DATA_DIR"
description = "Directorio raíz de datos de mercado"
example = "./data"
required = true
var_type = "path"
secret = false
source_tool = "ft_setup"
since_version = "0.1.0"

[[vars]]
name = "FT_RAW_DIR"
description = "Directorio de datos crudos descargados"
example = "./data/raw"
required = true
var_type = "path"
secret = false
source_tool = "ft_setup"
since_version = "0.1.0"

[[vars]]
name = "FT_PROCESSED_DIR"
description = "Directorio de datos procesados/normalizados"
example = "./data/processed"
required = true
var_type = "path"
secret = false
source_tool = "ft_setup"
since_version = "0.1.0"

[[vars]]
name = "FT_PARQUET_DIR"
description = "Directorio de archivos Parquet particionados"
example = "./data/parquet"
required = true
var_type = "path"
secret = false
source_tool = "ft_setup"
since_version = "0.1.0"

[[vars]]
name = "FT_LOGS_DIR"
description = "Directorio de logs de la suite"
example = "./logs"
required = true
var_type = "path"
secret = false
source_tool = "ft_setup"
since_version = "0.1.0"

[[vars]]
name = "FT_STRATEGIES_DIR"
description = "Directorio de definiciones de estrategias"
example = "./strategies"
required = true
var_type = "path"
secret = false
source_tool = "ft_setup"
since_version = "0.1.0"

[[vars]]
name = "FT_RESULTS_DIR"
description = "Directorio de resultados de backtests/análisis"
example = "./results"
required = true
var_type = "path"
secret = false
source_tool = "ft_setup"
since_version = "0.1.0"

[[vars]]
name = "FT_SHARE_DIR"
description = "Directorio compartido (tasks.db, etc.)"
example = "./share"
required = true
var_type = "path"
secret = false
source_tool = "ft_setup"
since_version = "0.1.0"

[[vars]]
name = "FT_TASKS_DB_PATH"
description = "Ruta absoluta al archivo SQLite de tareas"
example = "./share/tasks.db"
required = true
var_type = "path"
secret = false
source_tool = "ft_setup"
since_version = "0.1.0"

[[vars]]
name = "FT_API_HOST"
description = "Host del servidor FastAPI"
example = "0.0.0.0"
required = true
var_type = "host_port"
secret = false
source_tool = "ft_setup"
since_version = "0.1.0"

[[vars]]
name = "FT_API_PORT"
description = "Puerto del servidor FastAPI"
example = "8000"
required = true
var_type = "host_port"
secret = false
source_tool = "ft_setup"
since_version = "0.1.0"

[[vars]]
name = "FT_API_WORKERS"
description = "Número de workers uvicorn"
example = "1"
required = false
var_type = "int"
secret = false
source_tool = "ft_setup"
since_version = "0.1.0"

[[vars]]
name = "FT_LOG_LEVEL"
description = "Nivel de logging (DEBUG, INFO, WARNING, ERROR)"
example = "INFO"
required = false
var_type = "str"
secret = false
source_tool = "ft_setup"
since_version = "0.1.0"

[[vars]]
name = "FT_BINANCE_API_KEY"
description = "API Key de Binance (Spot/Futures)"
example = "***"
required = false
var_type = "str"
secret = true
source_tool = "ft_market_data_binance"
since_version = "0.1.0"

[[vars]]
name = "FT_BINANCE_API_SECRET"
description = "API Secret de Binance"
example = "***"
required = false
var_type = "str"
secret = true
source_tool = "ft_market_data_binance"
since_version = "0.1.0"

[[vars]]
name = "FT_BINANCE_PUBLIC_DATA_BASE_URL_SPOT"
description = "URL base Binance Public Data Spot"
example = "https://data.binance.vision/data/spot"
required = false
var_type = "url"
secret = false
source_tool = "ft_market_data_binance"
since_version = "0.1.0"

[[vars]]
name = "FT_BINANCE_PUBLIC_DATA_BASE_URL_FUTURES"
description = "URL base Binance Public Data Futures"
example = "https://data.binance.vision/data/futures/um"
required = false
var_type = "url"
secret = false
source_tool = "ft_market_data_binance"
since_version = "0.1.0"

[[vars]]
name = "FT_BINANCE_PUBLIC_DATA_RATE_CAPACITY"
description = "Capacidad Token Bucket Public Data"
example = "50"
required = false
var_type = "int"
secret = false
source_tool = "ft_market_data_binance"
since_version = "0.1.0"

[[vars]]
name = "FT_BINANCE_PUBLIC_DATA_RATE_REFILL_RATE"
description = "Tasa recarga Token Bucket Public Data (tokens/seg)"
example = "10.0"
required = false
var_type = "float"
secret = false
source_tool = "ft_market_data_binance"
since_version = "0.1.0"

[[vars]]
name = "FT_BINANCE_REST_BASE_URL_SPOT"
description = "URL base Binance REST API Spot"
example = "https://api.binance.com"
required = false
var_type = "url"
secret = false
source_tool = "ft_market_data_binance"
since_version = "0.1.0"

[[vars]]
name = "FT_BINANCE_REST_BASE_URL_FUTURES"
description = "URL base Binance REST API Futures"
example = "https://fapi.binance.com"
required = false
var_type = "url"
secret = false
source_tool = "ft_market_data_binance"
since_version = "0.1.0"

[[vars]]
name = "FT_BINANCE_REST_RATE_CAPACITY"
description = "Capacidad Token Bucket REST API (weight/min)"
example = "1200"
required = false
var_type = "int"
secret = false
source_tool = "ft_market_data_binance"
since_version = "0.1.0"

[[vars]]
name = "FT_BINANCE_REST_RATE_REFILL_RATE"
description = "Tasa recarga Token Bucket REST API (tokens/seg)"
example = "20.0"
required = false
var_type = "float"
secret = false
source_tool = "ft_market_data_binance"
since_version = "0.1.0"

[[vars]]
name = "FT_BINANCE_MAX_RETRIES"
description = "Máximo reintentos REST API ante 429/5xx"
example = "3"
required = false
var_type = "int"
secret = false
source_tool = "ft_market_data_binance"
since_version = "0.1.0"

[[vars]]
name = "FT_BINANCE_BASE_BACKOFF_MS"
description = "Backoff base en ms para retry exponencial"
example = "1000"
required = false
var_type = "int"
secret = false
source_tool = "ft_market_data_binance"
since_version = "0.1.0"

[[vars]]
name = "FT_DOWNLOAD_MAX_CONCURRENT"
description = "Descargas simultáneas máximas (Public Data + REST)"
example = "5"
required = false
var_type = "int"
secret = false
source_tool = "ft_market_data_binance"
since_version = "0.1.0"

[[vars]]
name = "FT_YFINANCE_API_KEY"
description = "API Key de Yahoo Finance (si aplica)"
example = "***"
required = false
var_type = "str"
secret = true
source_tool = "ft_market_data_yfinance"
since_version = "0.1.0"