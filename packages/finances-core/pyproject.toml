[project]
name = "finances-core"
version = "0.1.0"
description = "Core utilities for financial_tools suite"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "fastapi>=0.111",
    "structlog>=24.1",
    "rich>=13.7",
    "python-dotenv>=1.0",
    "uuid6>=1.11",
    "polars>=1.6",
    "tenacity>=8.2",
    "numpy>=1.26",
    "jsonschema>=4.21",
    "jsonpatch>=1.33",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "hypothesis>=6.100",
    "types-PyYAML>=6.0",
    "types-jsonschema>=4.21",
]

[project.scripts]
ft_setup = "ft_setup.cli:app"
ft_strategy_manager = "ft_strategy_manager.cli:app"

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["finances_core*", "ft_setup*", "ft_strategy_manager*"]

[tool.setuptools.package-data]
ft_setup = ["env_list.conf", "templates/*.j2", "py.typed"]
ft_strategy_manager = ["py.typed"]
# Las carpetas de estrategias integradas y _template no son paquetes (sin __init__.py):
# su código y README se instalan como datos para que el descubrimiento funcione
# instalado, no solo en modo editable (plan §4, RF-18).
finances_core = [
    "py.typed",
    "backtest/strategies/*/*.py",
    "backtest/strategies/*/README.md",
]

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = ["**/.venv/**", "**/__pycache__/**"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T20", "PTH", "PD", "PGH", "PL", "TRY", "NPY"]
fixable = ["I", "F", "E", "W", "UP", "B", "C4", "SIM", "T20", "PTH", "PD", "PGH", "PL", "TRY", "NPY"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "TRY003"]
# Firma retrocompatible exigida por specs/ft_indicators/plan.md §4 (file_name, mode)
"src/finances_core/marketdata/hive_writer.py" = ["PLR0913"]
# Firma de run_compute_task exigida por specs/ft_indicators/plan.md §3.8
"src/finances_core/indicators_store/runner.py" = ["PLR0913", "PLR0917"]
# Opciones Typer de ft_strategy_manager: una por parámetro de RF-1/RF-3/RF-5 (plan.md §2.1)
"src/ft_strategy_manager/cli.py" = ["PLR0913", "PLR0917"]

[tool.mypy]
strict = true
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
markers = ["real_data: tests con datos reales materializados por ft_datasets; excluidos por defecto"]
addopts = "-v --tb=short -m 'not real_data'"

[[tool.mypy.overrides]]
module = ["jsonpatch", "jsonpointer"]
ignore_missing_imports = true
