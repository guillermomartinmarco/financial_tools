[project]
name = "finances-backtester"
version = "0.1.0"
description = "Backtesting engines (ft_vectorbt and siblings) for financial_tools suite"
# A16: cota según la evidencia de ft_vectorbt V0.2 (vectorbt 1.2.0 declara <3.15).
requires-python = ">=3.11,<3.15"
dependencies = [
    "finances-core",
    "polars>=1.6",
    "pydantic>=2.8",
    "pydantic-settings>=2.3",
    "typer>=0.12",
    "fastapi>=0.111",
    "structlog>=24.1",
    "rich>=13.7",
    "uuid6>=1.11",
    "pyarrow>=16.0",
    # ft_vectorbt (V0.2): pin verificado con evidencia en specs/ft_vectorbt/tasks.md; numpy y
    # pandas explícitos porque engine.py los usa en la frontera float64 (RFC-0004).
    # Licencia de vectorbt: Apache 2.0 con Commons Clause (prohíbe venderlo; uso no comercial).
    "vectorbt>=1.2.0,<1.3",
    "numpy>=2.5",
    "pandas>=3.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.2",
    "pytest-asyncio>=0.23",
    "httpx>=0.27",
    "ruff>=0.5",
    "mypy>=1.10",
    "hypothesis>=6.100",
]

[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]
include = ["finances_backtester*"]

[tool.setuptools.package-data]
finances_backtester = ["py.typed"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP", "B", "C4", "SIM", "T20", "PTH", "PD", "PGH", "PL", "TRY", "NPY"]
ignore = []
fixable = ["I", "F", "E", "W", "UP", "B", "C4", "SIM", "T20", "PTH", "PD", "PGH", "PL", "TRY", "NPY"]
unfixable = []
exclude = ["**/.venv/**", "**/__pycache__/**"]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["PLR2004", "TRY003", "PLR0913", "PLR0917"]
# pandas/NumPy solo se admiten dentro de la frontera de cada motor (RFC-0004).
"src/finances_backtester/*/engine.py" = ["PD", "NPY"]
# Firmas planas exigidas por plan.md (opciones Typer / query params FastAPI)
"src/finances_backtester/*/cli.py" = ["PLR0913", "PLR0917"]
"src/finances_backtester/*/api.py" = ["PLR0913", "PLR0917"]

[tool.ruff.lint.flake8-bugbear]
extend-immutable-calls = ["typer.Option", "typer.Argument", "fastapi.Query", "fastapi.Path", "fastapi.Depends"]

[tool.ruff.format]
quote-style = "double"
indent-style = "space"
skip-magic-trailing-comma = false
line-ending = "lf"

[tool.mypy]
strict = true
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
no_implicit_optional = true
show_error_codes = true
pretty = true
namespace_packages = true
explicit_package_bases = true
mypy_path = "src"

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
